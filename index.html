<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PINK DASH 2077</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #05020a;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 900px;
      height: 500px;
      max-width: 100vw;
      max-height: 100vh;
      background: #0d021a;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(255, 20, 147, 0.4), inset 0 0 30px rgba(255, 20, 147, 0.2);
      border: 2px solid #ff1493;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 2, 20, 0.92);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    .game-title {
      font-size: 54px;
      font-weight: 900;
      color: #ff69b4;
      text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 40px #ff1493, 0 0 80px #ff69b4;
      margin-bottom: 35px;
      letter-spacing: 4px;
      text-align: center;
    }

    .btn {
      background: #ff1493;
      color: #fff;
      border: none;
      padding: 16px 50px;
      font-size: 22px;
      font-weight: 700;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 0 25px #ff1493, 0 0 50px rgba(255, 20, 147, 0.6);
      transition: all 0.2s ease;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #fff;
    }

    .btn:hover, .btn:active {
      transform: scale(1.08);
      background: #ff69b4;
      box-shadow: 0 0 35px #ff69b4, 0 0 70px #ff1493;
    }

    .instructions-card {
      background: rgba(255, 20, 147, 0.08);
      border: 1px solid #ff1493;
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
      border-radius: 16px;
      padding: 25px 40px;
      margin-bottom: 30px;
      text-align: center;
      max-width: 480px;
    }

    .instructions-card h2 {
      color: #ff69b4;
      font-size: 22px;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #ff1493;
    }

    .instructions-card p {
      color: #fff;
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      font-size: 14px;
      font-weight: 700;
      color: #ff69b4;
      text-shadow: 0 0 10px #ff1493;
    }

    .score-box {
      background: rgba(255, 20, 147, 0.15);
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid #ff1493;
      box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
    }

    .pause-top-btn {
      pointer-events: auto;
      background: rgba(255, 20, 147, 0.25);
      border: 1px solid #ff1493;
      color: #fff;
      padding: 6px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
      transition: all 0.2s;
    }

    .pause-top-btn:active {
      transform: scale(0.95);
      background: #ff1493;
    }

    .mobile-controls {
      position: absolute;
      bottom: 25px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      z-index: 6;
      pointer-events: none;
    }

    .touch-btn {
      pointer-events: auto;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(255, 20, 147, 0.25);
      border: 2px solid #ff1493;
      box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      transition: transform 0.1s ease, background 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(255, 105, 180, 0.6);
      box-shadow: 0 0 35px #ff69b4;
    }

    @media (max-width: 600px) {
      .game-title { font-size: 36px; }
      .btn { padding: 12px 35px; font-size: 18px; }
      .instructions-card { padding: 15px 20px; }
      .touch-btn { width: 70px; height: 70px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="score-box">SCORE: <span id="score-val" style="color: #fff;">0</span></div>
      <button id="pause-btn" class="pause-top-btn hidden">PAUSE ⏸</button>
      <div class="score-box">HIGH: <span id="high-score-val" style="color: #fff;">0</span></div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="mobile-controls hidden">
      <div id="slide-btn" class="touch-btn">SLIDE<br>↓</div>
      <div id="jump-btn" class="touch-btn">JUMP<br>↑</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
      <h1 class="game-title">PINK DASH 2077</h1>
      <button id="play-btn" class="btn">PLAY</button>
    </div>

    <!-- Instructions Screen -->
    <div id="instructions-screen" class="screen hidden">
      <div class="instructions-card">
        <h2>HOW TO PLAY</h2>
        <p>• <b>DOUBLE JUMP:</b> Tap JUMP / SPACE twice!</p>
        <p>• <b>SLIDE:</b> Hold SLIDE or ↓</p>
        <p>• <b>PAUSE:</b> Tap PAUSE button or ESC key</p>
      </div>
      <button id="continue-btn" class="btn">CONTINUE</button>
    </div>

    <!-- Pause Screen -->
    <div id="pause-screen" class="screen hidden">
      <h1 class="game-title" style="font-size: 42px;">PAUSED</h1>
      <button id="resume-btn" class="btn">RESUME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
      <h1 class="game-title" style="font-size: 40px;">GAME OVER</h1>
      <div class="instructions-card" style="margin-bottom: 25px;">
        <p>FINAL SCORE: <span id="final-score" style="color: #ff69b4; font-weight: bold;">0</span></p>
        <p>TIME SURVIVED: <span id="final-time" style="color: #ff69b4; font-weight: bold;">0s</span></p>
      </div>
      <button id="restart-btn" class="btn">RESTART</button>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const instructionsScreen = document.getElementById('instructions-screen');
    const pauseScreen = document.getElementById('pause-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const mobileControls = document.getElementById('mobile-controls');
    
    const playBtn = document.getElementById('play-btn');
    const continueBtn = document.getElementById('continue-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const restartBtn = document.getElementById('restart-btn');
    
    const jumpBtn = document.getElementById('jump-btn');
    const slideBtn = document.getElementById('slide-btn');

    const scoreVal = document.getElementById('score-val');
    const highScoreVal = document.getElementById('high-score-val');
    const finalScore = document.getElementById('final-score');
    const finalTime = document.getElementById('final-time');

    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game States
    let isPlaying = false;
    let isPaused = false;
    let score = 0;
    let startTime = 0;
    let totalPauseTime = 0;
    let pauseStartTime = 0;
    let elapsedTime = 0;
    let highScore = localStorage.getItem('pink_dash_high') || 0;
    highScoreVal.textContent = highScore;
    let gameSpeed = 6;
    let frameCount = 0;
    let animId = null;

    // Player Object
    const player = {
      x: 100,
      y: 350,
      width: 40,
      height: 50,
      baseHeight: 50,
      slideHeight: 25,
      velocityY: 0,
      gravity: 0.75,
      jumpPower: -13.5,
      jumpCount: 0,
      maxJumps: 2,
      isGrounded: true,
      isSliding: false
    };

    let obstacles = [];
    let coins = [];

    // UI Listeners
    playBtn.addEventListener('click', () => {
      playSound(600, 'sine', 0.1);
      startScreen.classList.add('hidden');
      instructionsScreen.classList.remove('hidden');
    });

    continueBtn.addEventListener('click', () => {
      playSound(800, 'sine', 0.15);
      instructionsScreen.classList.add('hidden');
      mobileControls.classList.remove('hidden');
      pauseBtn.classList.remove('hidden');
      startGame();
    });

    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);

    restartBtn.addEventListener('click', () => {
      playSound(700, 'sine', 0.15);
      gameOverScreen.classList.add('hidden');
      mobileControls.classList.remove('hidden');
      pauseBtn.classList.remove('hidden');
      startGame();
    });

    function togglePause() {
      if (!isPlaying) return;
      isPaused = !isPaused;

      if (isPaused) {
        pauseStartTime = Date.now();
        pauseScreen.classList.remove('hidden');
        mobileControls.classList.add('hidden');
        cancelAnimationFrame(animId);
      } else {
        totalPauseTime += (Date.now() - pauseStartTime);
        pauseScreen.classList.add('hidden');
        mobileControls.classList.remove('hidden');
        animate();
      }
    }

    // Jump / Slide Functions
    function doJump() {
      if (!isPlaying || isPaused) return;
      if (player.jumpCount < player.maxJumps) {
        player.velocityY = player.jumpPower;
        player.jumpCount++;
        player.isGrounded = false;
        playSound(400 + player.jumpCount * 200, 'square', 0.12);
      }
    }

    function startSlide() {
      if (!isPlaying || isPaused) return;
      if (player.isGrounded) {
        player.isSliding = true;
        player.height = player.slideHeight;
      }
    }

    function stopSlide() {
      player.isSliding = false;
      player.height = player.baseHeight;
    }

    // Keyboard Input
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') doJump();
      if (e.code === 'ArrowDown') startSlide();
      if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') stopSlide();
    });

    // Touch Controls (Mobile)
    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
    slideBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startSlide(); });
    slideBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopSlide(); });

    jumpBtn.addEventListener('mousedown', doJump);
    slideBtn.addEventListener('mousedown', startSlide);
    slideBtn.addEventListener('mouseup', stopSlide);

    function startGame() {
      isPlaying = true;
      isPaused = false;
      score = 0;
      gameSpeed = 6;
      frameCount = 0;
      totalPauseTime = 0;
      startTime = Date.now();
      obstacles = [];
      coins = [];
      player.y = 350;
      player.velocityY = 0;
      player.jumpCount = 0;
      scoreVal.textContent = '0';
      animate();
    }

    function animate() {
      if (!isPlaying || isPaused) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      frameCount++;

      // Timer
      elapsedTime = Math.floor((Date.now() - startTime - totalPauseTime) / 1000);

      // Player Physics
      player.velocityY += player.gravity;
      player.y += player.velocityY;

      const groundY = 400 - player.height;
      if (player.y >= groundY) {
        player.y = groundY;
        player.velocityY = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
      }

      // Neon Grid Ground
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff1493';
      ctx.fillStyle = '#ff1493';
      ctx.fillRect(0, 400, canvas.width, 4);

      ctx.fillStyle = 'rgba(255, 20, 147, 0.08)';
      ctx.fillRect(0, 404, canvas.width, 96);

      // Neon Player
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#ff69b4';
      ctx.fillStyle = '#ff69b4';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, player.height - 10);

      // Spawn Obstacles
      if (frameCount % 90 === 0) {
        const isHigh = Math.random() > 0.5;
        obstacles.push({
          x: canvas.width,
          y: isHigh ? 310 : 360,
          width: 30,
          height: isHigh ? 30 : 40
        });
      }

      // Spawn Neon Stars
      if (frameCount % 120 === 0) {
        coins.push({
          x: canvas.width,
          y: Math.random() > 0.5 ? 310 : 250,
          size: 10
        });
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff1493';
        ctx.fillStyle = '#ff1493';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // Collision Check
        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          endGame();
        }

        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
      }

      // Update Coins
      for (let i = coins.length - 1; i >= 0; i--) {
        let coin = coins[i];
        coin.x -= gameSpeed;

        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.size, 0, Math.PI * 2);
        ctx.fill();

        // Collection Check
        let dist = Math.hypot(player.x + player.width/2 - coin.x, player.y + player.height/2 - coin.y);
        if (dist < player.width/2 + coin.size) {
          score += 15;
          scoreVal.textContent = score;
          playSound(900, 'triangle', 0.08);
          coins.splice(i, 1);
        } else if (coin.x < 0) {
          coins.splice(i, 1);
        }
      }

      // Progression
      if (frameCount % 6 === 0) {
        score++;
        scoreVal.textContent = score;
      }
      if (frameCount % 400 === 0) {
        gameSpeed += 0.6;
      }

      ctx.shadowBlur = 0;
      animId = requestAnimationFrame(animate);
    }

    function endGame() {
      isPlaying = false;
      playSound(150, 'sawtooth', 0.3);
      mobileControls.classList.add('hidden');
      pauseBtn.classList.add('hidden');
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('pink_dash_high', highScore);
        highScoreVal.textContent = highScore;
      }
      finalScore.textContent = score;
      finalTime.textContent = `${elapsedTime}s`;
      gameOverScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
